name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tic-tac-toe-mini-app-client/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: tic-tac-toe-mini-app-client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tic-tac-toe-mini-app-client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
          VITE_BOT_APP_URL: ${{ vars.BOT_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tic-tac-toe-mini-app-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
