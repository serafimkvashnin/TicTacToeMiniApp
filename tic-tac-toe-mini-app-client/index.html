<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tic Tac Toe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      /* Анимация прозрачная — фон задаёт страница, тем же цветом, что и шапка Telegram */
      #splash { position: fixed; inset: 0; z-index: 1000; background: #111827; transition: opacity 0.4s ease-out; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <!-- Заставка студии: анимированный WebP из проекта NamingIssuesBranding (game-splash, 4,8 с) -->
    <div id="splash"><img src="./splash.webp" alt="" /></div>
    <script>
      ;(function () {
        var DURATION = 4800
        var splash = document.getElementById('splash'), img = splash.firstElementChild, done = false
        try { Telegram.WebApp.setHeaderColor('#111827'); Telegram.WebApp.setBackgroundColor('#111827') } catch (e) {}
        // Растворяется поверх игры; App ждёт событие, чтобы перекрасить шапку Telegram
        function finish() {
          if (done) return
          done = true
          window.__splashDone = true
          window.dispatchEvent(new Event('splash:done'))
          splash.classList.add('hide')
          setTimeout(function () { splash.remove() }, 450)
        }
        // У картинки нет события окончания — анимация идёт с момента загрузки, убираем по таймеру
        function start() { setTimeout(finish, DURATION) }
        if (img.complete && img.naturalWidth) start()
        else { img.addEventListener('load', start); img.addEventListener('error', finish) }
        splash.addEventListener('click', finish)
        // Медленная сеть — не держим игрока
        setTimeout(function () { if (!img.complete) finish() }, 2000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
